trigger:
- main

pool:
  vmImage: vishalAgent_75


steps:
- task: HCLAppScanOnCloudCustom@2
  inputs:
    AppSecTestService: 'EU_Prod'
    applications: '06076bc5-63d1-4f95-93a6-1c096e664645'
    scanname: 'check_static'
    scantype: 'static'
    scanloc: '$(Agent.WorkFolder)\Nested\Folder'
    scanMethod: 'IRX'
    ScanSpeedOptions: 'balanced'
    intervention: false

    